{% extends "base.html" %}
{% block title %}Heatmap · HabitLab{% endblock %}
{% block nav_stats %}active{% endblock %}

{% block panels %}
<div class="list-panel" style="width:100%;max-width:100%">
    <div class="list-topbar">
        <a href="/" style="color:var(--accent-light);font-size:13px;text-decoration:none">← Back</a>
        <span class="list-topbar-title" style="margin-left:8px" id="myName">Multi-year heatmap</span>
    </div>
    <div class="heatmap-page" id="multiYearRoot" data-habit-id="{{ habit_id }}">
        <div id="yearsContainer"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import { renderMultiYearHeatmap } from '/static/js/heatmap.js?v={{ asset_version }}';
    renderMultiYearHeatmap();
</script>
{% endblock %}
