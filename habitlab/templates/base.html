<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>{% block title %}HabitLab{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0d0d11">
<link rel="stylesheet" href="/static/css/styles.css?v={{ asset_version }}">
<script>
    (function(){
        var t=localStorage.getItem('theme')||'midnight';
        document.documentElement.setAttribute('data-theme',t);
    })();
</script>
</head>
<body>

<div class="app">
    <!-- Nav rail (desktop only) -->
    <nav class="nav-rail" id="navRail">
        <div class="nav-avatar" id="navAvatar">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="28" height="28">
              <g transform="translate(5 6)">
                <rect x="0" y="0" width="6" height="6" rx="1" fill="currentColor"/>
                <rect x="8" y="0" width="6" height="6" rx="1" fill="currentColor"/>
                <rect x="16" y="0" width="6" height="6" rx="1" fill="currentColor"/>
                <rect x="0" y="8" width="6" height="6" rx="1" fill="currentColor"/>
                <rect x="8" y="8" width="6" height="6" rx="1" fill="currentColor"/>
                <rect x="16" y="8" width="6" height="6" rx="1" fill="currentColor"/>
                <rect x="0" y="16" width="6" height="6" rx="1" fill="currentColor"/>
                <rect x="8" y="16" width="6" height="6" rx="1" fill="currentColor"/>
                <rect x="16" y="16" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="19" cy="19" r="1.6" fill="currentColor"/>
              </g>
            </svg>
        </div>
        <a href="/today" class="nav-item {% block nav_today %}{% endblock %}" title="Today">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span class="nav-label">Today</span>
        </a>
        <a href="/habits" class="nav-item {% block nav_habits %}{% endblock %}" title="Habits">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            <span class="nav-label">Habits</span>
        </a>
        <a href="/notes" class="nav-item {% block nav_notes %}{% endblock %}" title="Notes">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <span class="nav-label">Notes</span>
        </a>
        <div class="nav-spacer"></div>
        <button class="nav-item" id="timerNavBtn" title="Focus timer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="nav-label">Timer</span>
        </button>
        <div id="timerNavPill" class="timer-nav-pill" style="display:none"></div>
        <button class="nav-item" id="settingsBtn" title="Settings" onclick="openSettings()">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            <span class="nav-label">Settings</span>
        </button>
    </nav>

    <!-- Main panels area -->
    <div class="panels">
        {% block panels %}{% endblock %}
    </div>

    <!-- Mobile tab bar (hidden on desktop via CSS) -->
    <nav class="mobile-tabs" id="mobileTabs">
        <a href="/today" class="mobile-tab {{ self.nav_today() }}" title="Today">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Today</span>
        </a>
        <a href="/habits" class="mobile-tab {{ self.nav_habits() }}" title="Habits">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            <span>Habits</span>
        </a>
        <a href="/notes" class="mobile-tab {{ self.nav_notes() }}" title="Notes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <span>Notes</span>
        </a>
        <button class="mobile-tab" onclick="openSettings()" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            <span>Settings</span>
        </button>
    </nav>
</div>

<!-- ── Focus timer overlay ───────────────────────────────────── -->
<div class="ov" id="timerOverlay">
    <div class="timer-modal">
        <button class="timer-close" id="timerCloseBtn">&times;</button>

        <div class="timer-mode" data-mode="work">FOCUS</div>

        <div class="timer-ring-wrap">
            <svg viewBox="0 0 120 120" width="200" height="200">
                <circle cx="60" cy="60" r="54" fill="none" stroke="var(--border)" stroke-width="6"/>
                <circle class="timer-ring-fill" cx="60" cy="60" r="54" fill="none"
                    stroke="var(--accent)" stroke-width="6"
                    stroke-linecap="round"
                    stroke-dasharray="339.3"
                    stroke-dashoffset="339.3"
                    transform="rotate(-90 60 60)"/>
            </svg>
            <div class="timer-display">25:00</div>
        </div>

        <div class="timer-controls">
            <button class="timer-btn-sec" id="timerResetBtn">Reset</button>
            <button class="timer-btn-pri" id="timerStartBtn">Start</button>
            <button class="timer-btn-sec" id="timerSkipBtn">Skip →</button>
        </div>

        <div class="timer-settings">
            <div class="timer-setting-row">
                <label>Focus</label>
                <input id="timerWorkMin" type="number" min="1" max="120" value="25">
                <span>min</span>
            </div>
            <div class="timer-setting-row">
                <label>Break</label>
                <input id="timerBreakMin" type="number" min="1" max="60" value="5">
                <span>min</span>
            </div>
        </div>
    </div>
</div>

{% include "_settings_modal.html" %}
{% include "_note_modal.html" %}
{% include "_habit_modal.html" %}

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="/static/vendor/sortable.min.js"></script>
<script type="module" src="/static/js/api.js?v={{ asset_version }}"></script>
<script type="module" src="/static/js/app.js?v={{ asset_version }}"></script>
<script type="module" src="/static/js/timer.js?v={{ asset_version }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
